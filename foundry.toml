[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"   # avoids PUSH0, for EVM chains that haven't adopted Shanghai
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512

[rpc_endpoints]
botchain = "https://rpc.botchain.ai"
botchain_testnet = "https://rpc.bohr.life"

[fmt]
line_length = 120
